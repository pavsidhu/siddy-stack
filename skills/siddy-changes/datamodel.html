<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
#wrap{position:relative;padding:0 22px 0 0}
#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
#grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(max(140px,28%),1fr));gap:22px 40px;align-items:start}
.pills{display:flex;flex-direction:column;align-items:flex-start}
.t{border:1.5px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.t.same{opacity:.6}
.t.new{border-color:var(--success)}
.t.changed{border-color:var(--warning)}
.t.deleted{border-color:var(--destructive)}
.h{display:flex;align-items:center;gap:6px;padding:5px 7px;font-family:var(--font-mono);font-weight:600;font-size:11.5px;overflow-wrap:anywhere}
.t:not(.pill) .h{border-bottom:1px solid var(--border)}
.t.new .h{background:color-mix(in srgb,var(--success) 14%,var(--card))}
.t.changed .h{background:color-mix(in srgb,var(--warning) 14%,var(--card))}
.t.deleted .h{background:color-mix(in srgb,var(--destructive) 14%,var(--card))}
.t.same .h{background:var(--muted)}
.t.deleted .h .n{text-decoration:line-through}
.t.pill{border-radius:999px;align-self:flex-start;max-width:100%}
.t.pill .h{padding:4px 10px}
.h .lbl{font-family:var(--font-sans);font-weight:400;font-size:10.5px;color:var(--muted-foreground)}
.c{display:flex;align-items:center;gap:5px;padding:2px 6px 2px 5px;border-left:3px solid transparent;font-family:var(--font-mono);font-size:10.5px;line-height:1.35;min-height:18px}
.c .k{width:15px;flex:none;font-size:8.5px;font-weight:700;color:var(--muted-foreground)}
.c .nm{min-width:0;overflow-wrap:anywhere}
.c.same{color:var(--muted-foreground)}
.c.new{border-left-color:var(--success);background:color-mix(in srgb,var(--success) 10%,var(--card))}
.c.changed{border-left-color:var(--warning);background:color-mix(in srgb,var(--warning) 10%,var(--card))}
.c.deleted{border-left-color:var(--destructive);background:color-mix(in srgb,var(--destructive) 10%,var(--card))}
.c.deleted .nm{text-decoration:line-through}
.c.more{display:block;padding:2px 8px;color:var(--muted-foreground);font-family:var(--font-sans);font-size:10.5px;font-style:italic}
.info{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);font:700 9px/12px var(--font-sans);text-align:center;padding:0;cursor:pointer;margin-left:auto;flex:none}
.info:hover,.info[aria-expanded=true]{border-color:var(--ring);color:var(--foreground);box-shadow:0 0 0 2px color-mix(in srgb,var(--ring) 40%,transparent)}
#pop{position:fixed;z-index:10;width:280px;max-width:calc(100vw - 16px);box-sizing:border-box;padding:12px 14px;border-radius:var(--radius);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);box-shadow:0 8px 24px rgb(0 0 0 / .25);font-size:12.5px;line-height:1.45;display:none}
#pop b{display:block;margin-bottom:4px;font-size:13px;font-family:var(--font-mono)}
#pop b span{font-weight:400;color:var(--muted-foreground)}
#pop p{margin:0 0 6px}
#pop p:last-child{margin:0}
#pop code{font-family:var(--font-mono);font-size:11.5px;background:var(--code-background);padding:0 3px;border-radius:3px}
</style></head><body>
<div id="wrap"><svg id="edges"></svg><div id="grid"></div></div>
<div id="pop" role="dialog"></div>
<script>
/*
  Fill in TABLES only. Do not change anything else in this file.
  The layout is automatic: changed tables are shown in full, up to three across, with the
  most-linked one in the middle. Unchanged tables, and ones with no columns, shrink to a name.
  Each table:
    name:    the table name, or an extension or enum
    label:   optional grey note after the name, such as "extension"
    state:   "new" (green), "changed" (yellow), "deleted" (red), "same" (grey, dimmed)
    details: optional HTML for the table's pop-up, as <p> paragraphs
    columns: list of columns. Show every new, changed or deleted column, plus the key
             columns that relationships need. Sum up the rest as { more: N }.
             Leave it out for unchanged tables.
  Each column:
    name, type, state (as above), details (optional pop-up HTML)
    key:     optional "pk" or "fk"
    ref:     for "fk", the name of the table it points to. A line is drawn when that
             table is in TABLES.
  Example:
    { name: "asset_embeddings", state: "new", details: "<p>...</p>", columns: [
      { name: "id", type: "uuid", key: "pk", state: "new" },
      { name: "assetId", type: "uuid", key: "fk", ref: "asset_versions", state: "new" },
      { more: 4 } ] },
    { name: "asset_versions", state: "same" }
*/
const TABLES = [];

const wrap=document.getElementById("wrap"),grid=document.getElementById("grid"),svg=document.getElementById("edges"),pop=document.getElementById("pop");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const items=[];
const btn=(name,type,details)=>details?"<button class='info' data-i='"+(items.push({name,type,details})-1)+"' aria-expanded='false' aria-label='About "+esc(name)+"'>?</button>":"";
const COLORS={new:"var(--success)",changed:"var(--warning)",deleted:"var(--destructive)",same:"var(--muted-foreground)"};
const isPill=t=>t.state==="same"||!(t.columns||[]).length;
const refsOf=t=>isPill(t)?[]:(t.columns||[]).filter(c=>c.ref&&TABLES.some(x=>x.name===c.ref)).map(c=>c.ref);
const deg=t=>refsOf(t).length+TABLES.filter(x=>refsOf(x).includes(t.name)).length;

function card(t){
 const pill=isPill(t),el=document.createElement("div");
 el.className="t "+t.state+(pill?" pill":"");el.dataset.table=t.name;
 el.innerHTML="<div class='h'><span class='n'>"+esc(t.name)+"</span>"+(t.label?"<span class='lbl'>"+esc(t.label)+"</span>":"")+btn(t.name,"",t.details)+"</div>"+(pill?"":t.columns.map(c=>c.more?"<div class='c more'>+"+c.more+" unchanged</div>":
  "<div class='c "+c.state+"'"+(c.ref?" data-ref='"+esc(c.ref)+"'":"")+" title='"+esc(c.type||"")+"'><span class='k'>"+(c.key?c.key.toUpperCase():"")+"</span><span class='nm'>"+esc(c.name)+"</span>"+btn(t.name+"."+c.name,c.type,c.details)+"</div>").join(""));
 return el;
}

// Full cards: most-linked in the middle of the first row, the rest by number of links.
const full=TABLES.filter(t=>!isPill(t)).sort((a,b)=>deg(b)-deg(a));
(full.length>2?[full[1],full[0],...full.slice(2)]:full).forEach(t=>grid.appendChild(card(t)));
// Name-only tables: stacked four to a cell after the full cards.
const pills=TABLES.filter(isPill),cells=[];
for(let i=0;i<pills.length;i+=4){const c=document.createElement("div");c.className="pills";pills.slice(i,i+4).forEach(t=>c.appendChild(card(t)));grid.appendChild(c);cells.push(c)}

// Line each name up with the keys that point at it, without overlapping.
function layout(){
 cells.forEach(cell=>{
  const ps=[...cell.children];ps.forEach(p=>p.style.marginTop="0");
  const top=cell.getBoundingClientRect().top;
  const want=p=>{const ys=[...grid.querySelectorAll(".c[data-ref='"+CSS.escape(p.dataset.table)+"']")].map(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2-top});return ys.length?ys.reduce((a,b)=>a+b)/ys.length:Infinity};
  const ws=new Map(ps.map(p=>[p,want(p)]));
  ps.sort((a,b)=>ws.get(a)-ws.get(b)).forEach(p=>cell.appendChild(p));
  let cur=0;
  ps.forEach(p=>{const h=p.offsetHeight,w=ws.get(p),y=Math.max(isFinite(w)?w-h/2:cur,cur);p.style.marginTop=(y-cur)+"px";cur=y+h+16});
 });
}

// Orthogonal path with rounded corners.
function route(pts){
 let d="M"+pts[0].join(" ");
 for(let i=1;i<pts.length-1;i++){
  const [px,py]=pts[i-1],[x,y]=pts[i],[nx,ny]=pts[i+1];
  const r=Math.min(6,Math.hypot(x-px,y-py)/2,Math.hypot(nx-x,ny-y)/2);
  const ax=x-Math.sign(x-px)*r,ay=y-Math.sign(y-py)*r,bx=x+Math.sign(nx-x)*r,by=y+Math.sign(ny-y)*r;
  d+=`L${ax} ${ay}Q${x} ${y} ${bx} ${by}`;
 }
 return d+"L"+pts[pts.length-1].join(" ");
}

function draw(){
 const W=wrap.getBoundingClientRect(),G=getComputedStyle(grid),cg=parseFloat(G.columnGap)/2,rg=parseFloat(G.rowGap)/2;
 const boxes=[...grid.querySelectorAll(".t")].map(el=>({el,b:el.getBoundingClientRect()}));
 let out="";
 grid.querySelectorAll(".c[data-ref]").forEach(c=>{
  const target=grid.querySelector(".t[data-table='"+CSS.escape(c.dataset.ref)+"']");if(!target)return;
  const src=c.closest(".t"),s=src.getBoundingClientRect(),r=c.getBoundingClientRect(),h=target.querySelector(".h").getBoundingClientRect(),tt=target.getBoundingClientRect();
  const y1=r.top+r.height/2-W.top,y2=h.top+h.height/2-W.top;let d,x1;
  const right=tt.left>=s.right,left=tt.right<=s.left;
  if(right||left){
   x1=(right?s.right:s.left)-W.left;const x2=(right?tt.left:tt.right)-W.left;
   const lo=Math.min(x1,x2)+W.left,hi=Math.max(x1,x2)+W.left,ya=Math.min(y1,y2)+W.top-4,yb=Math.max(y1,y2)+W.top+4;
   const hit=boxes.filter(({el,b})=>el!==src&&el!==target&&b.right>lo&&b.left<hi&&b.bottom>ya&&b.top<yb);
   if(!hit.length){const m=(x2-x1)/2;d=`M${x1} ${y1}C${x1+m} ${y1} ${x2-m} ${y2} ${x2} ${y2}`}
   else{
    // Something is in the way: drop into the gap below it, cross, and come back up.
    const dir=right?1:-1,xa=x1+dir*cg,xb=x2-dir*cg,yc=Math.max(...hit.map(({b})=>b.bottom))-W.top+rg;
    d=route([[x1,y1],[xa,y1],[xa,yc],[xb,yc],[xb,y2],[x2,y2]]);
   }
  } else {
   x1=s.right-W.left;const x2=tt.right-W.left,x=Math.max(x1,x2)+18;d=`M${x1} ${y1}C${x} ${y1} ${x} ${y2} ${x2} ${y2}`;
  }
  const st=["new","changed","deleted"].find(k=>c.classList.contains(k))||"same",col=COLORS[st];
  out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"${st==="same"?' stroke-dasharray="3 3" opacity=".6"':""}/><circle cx="${x1}" cy="${y1}" r="2.5" fill="${col}"/>`;
 });
 svg.innerHTML=out;
}
const run=()=>{layout();draw()};
run();document.fonts&&document.fonts.ready.then(run);addEventListener("resize",()=>{run();close()});

let open=null;
function close(){if(open){open.setAttribute("aria-expanded","false");open=null}pop.style.display="none"}
function show(b){
 close();open=b;b.setAttribute("aria-expanded","true");
 const it=items[b.dataset.i];
 pop.innerHTML="<b>"+esc(it.name)+(it.type?" <span>"+esc(it.type)+"</span>":"")+"</b>"+it.details;pop.style.display="block";
 const box=b.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
 const left=Math.min(Math.max(8,box.right-pw),innerWidth-pw-8);
 let top=box.bottom+6;if(top+ph>innerHeight-4)top=Math.max(4,box.top-ph-6);
 pop.style.left=left+"px";pop.style.top=top+"px";
}
document.addEventListener("click",e=>{const b=e.target.closest(".info[data-i]");if(b){e.stopPropagation();open===b?close():show(b);return}if(!pop.contains(e.target))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
addEventListener("scroll",close,true);
</script></body></html>
